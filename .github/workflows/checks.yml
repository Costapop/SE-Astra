name: Verify SE Astra
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- index.html dist
      - run: npm run verify:book
      - run: npm run verify:backside
      - run: npm run examples:check
      - run: npm run test:analysis
      - run: npm run test:astra
      - run: npm run test:illustrations
      - run: npm test
      - run: npm run test:demo
